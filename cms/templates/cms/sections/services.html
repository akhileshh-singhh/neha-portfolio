{% load cms_tags %}
<section class="sl t4 {{ s.css_class }}" {% include "cms/sections/_attrs.html" %}>
{% for i in s.vis_items %}<div class="s"><h2>{{ i.title|rich }}</h2><p>{{ i.text|rich }}</p></div>
